<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hush Mode</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main class="blocked-shell">
    <header class="brand">
      <img src="icon48.png" alt="" width="36" height="36">
      <span>hush</span>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-product">MODE</span>
    </header>
    <section class="focus-card" aria-live="polite">
      <img class="focus-mark" src="icon128.png" width="52" height="52" alt="">
      <p class="eyebrow">A MOMENT FOR WHAT MATTERS</p>
      <h1 id="title">Focus session active</h1>
      <p id="status" class="session-status" role="status">Checking your timer…</p>
      <p class="description">Your page is still here. Pause or finish your timer in hush when you’re ready to return.</p>
      <button id="back" type="button">Go back</button>
    </section>
    <footer>Stay with hush</footer>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
